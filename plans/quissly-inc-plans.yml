description: >-
  Quissly prices its two products separately (no combo/bundle). QSearch is metered by search
  requests and QChat by AI interactions (chat messages); the monthly-session figures are only a
  self-identification guide. Overage is progressive (cheaper per unit at higher tiers) and billed
  as-you-go with no forced tier jump. Prices below are monthly; annual billing is cheaper.
sources:
- https://quissly.com/llms.txt
- https://quissly.com/pricing
