aid: quissly-inc
name: Quissly Inc.
description: >-
  Quissly, Inc. is a Delaware-based SaaS company building an AI-powered search and conversational
  commerce platform for online stores. Its two products, QSearch and QChat, replace keyword search
  with semantic AI that understands natural-language queries like "something to wear to a beach
  wedding" and maps them to relevant products. QSearch offers semantic and visual similarity search,
  synonym/typo handling, voice search, AI recommendations, custom merchandising rules and a real-time
  analytics dashboard across 40+ languages; QChat is a conversational shopping assistant with product
  Q&A, guided shopping, personalization, and omnichannel/live-chat human handoff. Quissly is a fully
  managed SaaS with sub-100ms search, a REST API, and native Shopify, WooCommerce and CS-Cart plugins,
  surfaced in the API Evangelist network as a 500 Global portfolio company.
